function renderExercise(ex, exIdx, current) {
  const subKey = `${state.selectedDay}-${ex.id}`;
  const activeSub = state.data.exerciseSubs[subKey];
  const displayName = activeSub || ex.name;
  const exEntry = current.exercises.find(e => e.id === ex.id);
  const allSets = exEntry ? exEntry.sets : [];
  const completedValid = allSets.filter(s => s && !s.pending && s.kg !== undefined && (s.type === 'valida' || s.type === 'avancada')).length;
  const allDone = completedValid >= ex.sets;
  const lastSet = getLastSetForExercise(state.selectedDay, ex.id);
  const progressInd = getProgressIndicator(ex.id);
  const stagnation = getStagnationAlert(ex.id);
  const pr = getPRForExercise(ex.id);

  let arrowHtml = '';
  if (progressInd === 'up') arrowHtml = '<span class="progress-arrow up">↑</span>';
  else if (progressInd === 'down') arrowHtml = '<span class="progress-arrow down">↓</span>';
  else if (progressInd === 'flat') arrowHtml = '<span class="progress-arrow flat">→</span>';

  // BUGFIX: estado de abertura agora vem do state, não de hardcoded
  // Default: primeiro exercício aberto se ainda não foi tocado nada
  const isOpen = state.openExercises[ex.id] === true;

  let setsToRender = allSets.length > 0 ? allSets : Array(ex.sets).fill(null).map(() => ({ pending: true, type: 'valida' }));
  if (allSets.length === 0) {
    if (!exEntry) {
      const newEx = { id: ex.id, sets: setsToRender, subUsed: activeSub };
      current.exercises.push(newEx);
      saveData();
    }
  }

  let setsHtml = '';
  setsToRender.forEach((s, i) => { setsHtml += renderSet(ex, i, s, setsToRender); });

  const showSubBox = state.showSubFor === ex.id;
  const avancadaWarn = getAvancadaWarning(ex, exEntry);

  return `
    <div class="ex-card">
      <div class="ex-header" onclick="toggleEx('${ex.id}')">
        <div class="ex-num ${allDone ? 'done' : ''}">${allDone ? '✓' : exIdx + 1}</div>
        <div class="ex-info">
          <div class="ex-name-row"><div class="ex-name">${displayName}</div>${arrowHtml}</div>
          <div class="ex-meta">${ex.sets}×${ex.reps} · ${ex.technique}${activeSub ? ' · <em style="color:var(--accent)">substituto</em>' : ''}</div>
        </div>
        <div class="ex-chevron ${isOpen ? 'open' : ''}">▼</div>
      </div>
      <div class="ex-body" ${isOpen ? '' : 'style="display:none"'}>
        ${stagnation ? `<div class="alert-box ${stagnation.type === 'red' ? 'red' : ''}">${stagnation.text}</div>` : ''}
        ${avancadaWarn ? `<div class="alert-box ${avancadaWarn.type === 'red' ? 'red' : ''}">${avancadaWarn.text}</div>` : ''}
        <div class="ex-note">${ex.note}</div>
        <div class="ex-stats">
          <span>Última: <strong>${lastSet ? lastSet.kg + 'kg × ' + lastSet.reps : '—'}</strong></span>
          <span>Meta: <strong>${ex.metaS1}kg</strong></span>
          ${pr && pr.maxLoad ? `<span>PR: <strong>${pr.maxLoad}kg × ${pr.maxLoadReps}</strong></span>` : ''}
          ${(() => { const rm = getBest1RM(ex.id); return rm ? `<span>1RM est: <strong>~${rm}kg</strong></span>` : ''; })()}
        </div>
        <div class="sub-toggle" onclick="event.stopPropagation(); toggleSub('${ex.id}')">
          🔁 ${showSubBox ? 'Fechar substitutos' : 'Trocar exercício'}
        </div>
        ${showSubBox ? renderSubBox(ex, subKey, activeSub) : ''}
        ${setsHtml}
        <div class="add-set-row">
          <button class="btn-add-set" onclick="addSetToExercise('${ex.id}', 'aquec')">+ Aquec</button>
          <button class="btn-add-set" onclick="addSetToExercise('${ex.id}', 'feeder')">+ Feeder</button>
          <button class="btn-add-set" onclick="addSetToExercise('${ex.id}', 'valida')">+ Válida</button>
          <button class="btn-add-set" onclick="addSetToExercise('${ex.id}', 'avancada')">+ Avançada</button>
        </div>
      </div>
    </div>
  `;
}

function renderSubBox(ex, subKey, activeSub) {
  return `
    <div class="sub-box">
      <div class="sub-box-title">Substituir por:</div>
      <div class="sub-option ${!activeSub ? 'active' : ''}" onclick="event.stopPropagation(); selectSub('${subKey}', null)">
        <span>${ex.name}</span>
        <span class="sub-rank">${!activeSub ? 'ATUAL' : 'ORIGINAL'}</span>
      </div>
      ${ex.subs.map((sub, i) => `
        <div class="sub-option ${activeSub === sub ? 'active' : ''}" onclick="event.stopPropagation(); selectSub('${subKey}', '${sub.replace(/'/g, "\\'")}')">
          <span>${sub}</span>
          <span class="sub-rank">${activeSub === sub ? 'ATUAL' : 'OPÇÃO ' + (i + 1)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderSet(ex, setIdx, setData, allSets) {
  const editKey = `${ex.id}-${setIdx}`;
  const isEditing = state.editingSet === editKey;
  const saved = setData && !setData.pending && setData.kg !== undefined;
  const type = setData ? setData.type : 'valida';
  const tecnica = setData ? setData.tecnica : null;
  const kg = saved ? setData.kg : '';
  const reps = saved ? setData.reps : '';
  const rpe = saved ? setData.rpe : '';

  const validSetIndices = allSets.map((s, i) => (s && (s.type === 'valida' || s.type === 'avancada')) ? i : -1).filter(i => i !== -1);
  const isLastValid = validSetIndices.length && validSetIndices[validSetIndices.length - 1] === setIdx;
  const isAmrap = (type === 'valida' || type === 'avancada') && isLastValid && ex.technique.toUpperCase().includes('AMRAP');

  const typeBtns = Object.keys(SET_TYPES).map(t => `
    <button class="type-btn t-${t} ${type === t ? 'active' : ''}" onclick="event.stopPropagation(); setSetType('${ex.id}', ${setIdx}, '${t}')">${SET_TYPES[t].label}</button>
  `).join('');

  // Seletor de técnica (só aparece se tipo === avançada)
  let tecSelectorHtml = '';
  if (type === 'avancada' && !saved) {
    const tecBtns = Object.keys(TECNICAS).map(k => `
      <button class="tec-btn ${tecnica === k ? 'active' : ''}" onclick="event.stopPropagation(); setSetTecnica('${ex.id}', ${setIdx}, '${k}')">${TECNICAS[k].label}</button>
    `).join('');
    tecSelectorHtml = `
      <div class="tec-selector">
        <div class="tec-selector-label">Qual técnica avançada?</div>
        ${tecBtns}
      </div>
    `;
  }

  if (saved && !isEditing) {
    const tecBadge = (type === 'avancada' && tecnica && TECNICAS[tecnica]) ? `<span class="tec-tag">${TECNICAS[tecnica].label}</span>` : '';
    return `
      <div class="set-row done t-${type}">
        <div class="set-head">
          <div class="set-num">${setIdx + 1}</div>
          <span class="set-type-tag t-${type}">${SET_TYPES[type].label}</span>${tecBadge}
          <div class="set-label"><strong>${kg}kg × ${reps}</strong> @RPE ${rpe}${isAmrap ? ' <span class="amrap-tag">· AMRAP</span>' : ''}</div>
          <button class="btn-edit" onclick="editSet('${ex.id}', ${setIdx})" title="Editar">✏️</button>
          <button class="btn-edit" onclick="removeSetFromExercise('${ex.id}', ${setIdx})" title="Excluir" style="color:var(--red)">🗑</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="set-row">
      <div class="set-head">
        <div class="set-num">${setIdx + 1}</div>
        <div class="set-label">Série ${setIdx + 1}${isAmrap ? ' <span class="amrap-tag">· AMRAP</span>' : ''}</div>
        ${isEditing ? `<button class="btn-edit" onclick="cancelEdit()" title="Cancelar">↩</button>` : ''}
        <button class="btn-edit" onclick="removeSetFromExercise('${ex.id}', ${setIdx})" title="Excluir" style="color:var(--red)">🗑</button>
      </div>
      <div class="type-selector">${typeBtns}</div>
      ${tecSelectorHtml}
      <div class="set-grid">
        <div><div class="field-label">KG</div><input type="number" inputmode="decimal" class="field-input" id="kg-${ex.id}-${setIdx}" value="${kg}"></div>
        <div><div class="field-label">Reps</div><input type="number" inputmode="numeric" class="field-input" id="reps-${ex.id}-${setIdx}" value="${reps}"></div>
        <div><div class="field-label">RPE</div><input type="number" inputmode="numeric" min="1" max="10" class="field-input" id="rpe-${ex.id}-${setIdx}" value="${rpe}"></div>
        <button class="btn-save" onclick="saveSet('${ex.id}', ${setIdx})">${isEditing ? '✓' : 'OK'}</button>
      </div>
    </div>
  `;
}

function renderTimer() {
  const mm = Math.floor(state.restRemaining / 60);
  const ss = state.restRemaining % 60;
  const pct = state.restTotal > 0 ? ((state.restTotal - state.restRemaining) / state.restTotal) * 100 : 0;
  return `
    <div class="timer">
      <div class="timer-row">
        <div class="timer-display ${state.restRemaining === 0 ? 'done' : ''}" id="timer-display">
          ${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}
        </div>
        <div class="timer-bar-wrap">
          <div class="timer-bar-bg"><div class="timer-bar ${state.restRemaining === 0 ? 'done' : ''}" id="timer-bar" style="width:${pct}%"></div></div>
          <div class="timer-label">Descanso</div>
        </div>
        <button class="btn-skip" onclick="stopRest()">Pular</button>
      </div>
      <div class="timer-quick">
        <button class="quick-btn" onclick="adjustRest(30)">30s</button>
        <button class="quick-btn" onclick="adjustRest(60)">1min</button>
        <button class="quick-btn" onclick="adjustRest(90)">1:30</button>
        <button class="quick-btn" onclick="adjustRest(120)">2min</button>
        <button class="quick-btn" onclick="adjustRest(180)">3min</button>
      </div>
    </div>
  `;
}

function renderHistory() {
  const sessions = [...state.data.sessions].reverse();
  const cardios = [...(state.data.cardios || [])].reverse();
  return `
    <div class="header">
      <button class="btn-back" onclick="goHome()">← Voltar</button>
      <div class="h-title" style="margin-top:8px">Histórico</div>
      <div class="h-meta">${sessions.length} sessões · ${cardios.length} cardios</div>
    </div>
    <div class="content">
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="btn-secondary" onclick="exportData()" style="margin-top:0">↓ Exportar</button>
        <button class="btn-secondary" onclick="triggerImport()" style="margin-top:0">↑ Importar</button>
      </div>

      <div class="hist-section-title">💪 Sessões de força</div>
      ${sessions.length === 0 ? '<div class="empty">Nenhuma sessão finalizada ainda</div>' : ''}
      ${sessions.map((s, idx) => {
        const realIdx = state.data.sessions.length - 1 - idx;
        const totalSets = s.exercises.reduce((a, e) => a + (e.sets ? e.sets.filter(Boolean).length : 0), 0);
        const totalVol = s.exercises.reduce((a, e) => {
          if (!e.sets) return a;
          return a + e.sets.filter(st => st && (st.type === 'valida' || st.type === 'avancada')).reduce((b, st) => b + st.kg * st.reps, 0);
        }, 0);
        const notesHtml = s.notes ? (() => {
          const n = s.notes;
          const parts = [];
          if (n.dorArticular) parts.push('⚠ dor articular');
          if (n.sono6h) parts.push('⚠ sono <6h');
          if (n.motivacao) parts.push(`motivação ${n.motivacao}/5`);
          return parts.length ? `<div style="font-size:10px;color:var(--text3);margin-top:2px">${parts.join(' · ')}</div>` : '';
        })() : '';
        return `
          <div class="history-card">
            <div class="history-head">
              <div class="history-name">${DAY_LABELS[s.day]}</div>
              <div class="history-date">${s.date.split('-').reverse().join('/')}</div>
            </div>
            <div class="history-meta">${s.exercises.length} exerc · ${totalSets} séries · ${Math.round(totalVol).toLocaleString('pt-BR')} kg vol · ${s.duration || '?'}min · energia ${s.energy || '?'}/10</div>
            ${notesHtml}
            ${s.exercises.map(e => {
              const exDef = PROGRAM[s.day] && PROGRAM[s.day].exercises.find(x => x.id === e.id);
              const completed = e.sets ? e.sets.filter(Boolean) : [];
              if (!exDef || !completed.length) return '';
              return `
                <div class="history-ex">
                  <strong>${e.subUsed || exDef.name}:</strong>
                  ${completed.map(c => {
                    const tec = c.tecnica && TECNICAS[c.tecnica] ? `[${TECNICAS[c.tecnica].label}]` : (c.type && c.type !== 'valida' ? `[${SET_TYPES[c.type]?.label || c.type}]` : '');
                    return `${c.kg}×${c.reps}@${c.rpe}${tec}`;
                  }).join(' · ')}
                </div>
              `;
            }).join('')}
            <div class="history-actions">
              <button class="btn-mini" onclick="showSummaryFor(${idx})">📋 Resumo</button>
              <button class="btn-mini" onclick="openEditSession(${realIdx})">✏️ Editar</button>
              <button class="btn-mini-red" onclick="deleteSession(${realIdx})">🗑 Excluir</button>
            </div>
          </div>
        `;
      }).join('')}

      <div class="hist-section-title">🏃 Cardios</div>
      ${cardios.length === 0 ? '<div class="empty" style="padding:20px">Nenhum cardio registrado ainda</div>' : ''}
      ${cardios.map((c, idx) => {
        const realIdx = (state.data.cardios || []).length - 1 - idx;
        const tipoLabel = CARDIO_TYPES[c.tipo]?.label || c.tipo;
        const tipoIcon = CARDIO_TYPES[c.tipo]?.icon || '💧';
        return `
          <div class="cardio-hist-card">
            <div class="cardio-hist-head">
              <div class="cardio-hist-name">${tipoIcon} ${tipoLabel}</div>
              <div class="cardio-hist-date">${c.date.split('-').reverse().join('/')}</div>
            </div>
            <div class="cardio-hist-meta">${c.duracao}min · intensidade ${c.intensidade}/10${c.incline ? ' · ' + c.incline : ''}${c.obs ? ' · ' + c.obs : ''}</div>
            <div class="history-actions">
              <button class="btn-mini" onclick="openEditCardio(${realIdx})">✏️ Editar</button>
              <button class="btn-mini-red" onclick="deleteCardio(${realIdx})">🗑 Excluir</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPRs() {
  const allExs = [];
  DAYS_ORDER.forEach(dayKey => {
    PROGRAM[dayKey].exercises.forEach(ex => {
      const pr = getPRForExercise(ex.id);
      const best1rm = getBest1RM(ex.id);
      if (pr && pr.maxLoad > 0) allExs.push({ id: ex.id, name: ex.name, day: DAY_LABELS[dayKey], pr, best1rm });
    });
  });
  return `
    <div class="header">
      <button class="btn-back" onclick="goHome()">← Voltar</button>
      <div class="h-title" style="margin-top:8px">PRs & Progressão</div>
      <div class="h-meta">${allExs.length} exercícios com PR registrado</div>
    </div>
    <div class="content">
      ${allExs.length === 0 ? '<div class="empty">Treine algumas sessões para começar a ver seus PRs</div>' : ''}
      ${allExs.map(item => `
        <div class="pr-card">
          <div class="pr-ex-name">${item.name} <span class="pr-badge">${item.day}</span></div>
          ${item.best1rm ? `
            <div class="pr-1rm">
              <div class="pr-1rm-label">1RM estimado (Epley)</div>
              <div class="pr-1rm-value">~${item.best1rm} kg</div>
            </div>
          ` : ''}
          <div class="pr-grid">
            <div class="pr-item">
              <div class="pr-item-label">Carga máxima</div>
              <div class="pr-item-value">${item.pr.maxLoad}kg × ${item.pr.maxLoadReps}</div>
              <div class="pr-item-sub">${item.pr.maxLoadDate.split('-').reverse().join('/')}</div>
            </div>
            <div class="pr-item">
              <div class="pr-item-label">Volume máximo</div>
              <div class="pr-item-value">${Math.round(item.pr.maxVolume).toLocaleString('pt-BR')} kg</div>
              <div class="pr-item-sub">${item.pr.maxVolumeDate.split('-').reverse().join('/')}</div>
            </div>
          </div>
          <button class="pr-chart-toggle" onclick="toggleChart('${item.id}')">
            ${state.openCharts[item.id] ? '▲ Fechar gráfico' : '📈 Ver progressão'}
          </button>
          ${state.openCharts[item.id] ? renderProgressChart(item.id, item.name) : ''}
        </div>
      `).join('')}
    </div>
  `;
}

function renderSummaryModal() {
  return `
    <div class="summary-modal" onclick="closeSummary()">
      <div class="summary-content" onclick="event.stopPropagation()">
        <div class="summary-head">
          <div class="summary-title">📋 Resumo da sessão</div>
          <button class="btn-close" onclick="closeSummary()">×</button>
        </div>
        <div class="summary-text" id="summary-text">${state.summaryText.replace(/</g, '&lt;')}</div>
        <div class="summary-actions">
          <button class="btn-primary" onclick="copyToClipboard(state.summaryText)" style="margin:0">📋 Copiar</button>
          <button class="btn-secondary" onclick="closeSummary()" style="margin:0">Fechar</button>
        </div>
      </div>
    </div>
  `;
}

function render() {
  const app = document.getElementById('app');
  let main = '';
  if (state.screen === 'home') main = renderHome();
  else if (state.screen === 'session') main = renderSession();
  else if (state.screen === 'history') main = renderHistory();
  else if (state.screen === 'prs') main = renderPRs();
  app.innerHTML = main
    + (state.cardioForm ? renderCardioForm() : '')
    + (state.finishForm ? renderFinishForm() : '')
    + (state.showSummary ? renderSummaryModal() : '');
  if (state.screen === 'session') updateSessionClock();
}

function selectDay(key) {
  state.selectedDay = key;
  state.screen = 'session';
  state.showSubFor = null;
  state.editingSet = null;
  // Abre primeiro exercício por padrão ao entrar
  const firstExId = PROGRAM[key].exercises[0]?.id;
  state.openExercises = firstExId ? { [firstExId]: true } : {};
  render();
  setTimeout(() => startSessionTimer(), 100);
}

function goHome() {
  state.screen = 'home'; state.homeTab = 'today'; state.editingSet = null;
  if (state.restInterval) { clearInterval(state.restInterval); state.restInterval = null; }
  state.restTimer = null;
  stopSessionTimer();
  render();
}

function goHistory() { state.screen = 'history'; render(); }
function goPRs() { state.screen = 'prs'; render(); }
function setHomeTab(tab) { state.homeTab = tab; render(); }

function toggleWarmup() {
  const body = document.getElementById('warmup-body');
  const chev = document.getElementById('warmup-chevron');
  if (body.style.display === 'none') { body.style.display = 'block'; chev.textContent = '▲'; }
  else { body.style.display = 'none'; chev.textContent = '▼'; }
}

// BUGFIX: toggleEx agora mexe no STATE, não no DOM diretamente
function toggleEx(id) {
  state.openExercises[id] = !state.openExercises[id];
  render();
}

function toggleSub(exId) {
  state.showSubFor = state.showSubFor === exId ? null : exId;
  state.openExercises[exId] = true; // mantém aberto
  render();
}

function selectSub(subKey, subName) {
  if (subName === null) delete state.data.exerciseSubs[subKey];
  else state.data.exerciseSubs[subKey] = subName;
  saveData();
  state.showSubFor = null;
  render();
}

function setSetType(exId, setIdx, type) {
  const current = getCurrentSession();
  let exEntry = current.exercises.find(e => e.id === exId);
  if (!exEntry) {
    exEntry = { id: exId, sets: [], subUsed: state.data.exerciseSubs[`${state.selectedDay}-${exId}`] || null };
    current.exercises.push(exEntry);
  }
  while (exEntry.sets.length <= setIdx) exEntry.sets.push(null);
  const existing = exEntry.sets[setIdx] || { pending: true };
  // Se trocou tipo, mas não é mais "avançada", limpa a técnica
  const newSet = { ...existing, type: type };
  if (type !== 'avancada') delete newSet.tecnica;
  exEntry.sets[setIdx] = newSet;
  state.openExercises[exId] = true;
  saveData();
  render();
}

// Seletor de técnica avançada
function setSetTecnica(exId, setIdx, tecnicaKey) {
  const current = getCurrentSession();
  let exEntry = current.exercises.find(e => e.id === exId);
  if (!exEntry) return;
  while (exEntry.sets.length <= setIdx) exEntry.sets.push(null);
  const existing = exEntry.sets[setIdx] || { pending: true, type: 'avancada' };
  // Toggle: se já era essa técnica, desmarca
  const newTecnica = existing.tecnica === tecnicaKey ? null : tecnicaKey;
  exEntry.sets[setIdx] = { ...existing, tecnica: newTecnica };
  state.openExercises[exId] = true;
  saveData();
  render();
}

function saveSet(exId, setIdx) {
  const kgEl = document.getElementById('kg-' + exId + '-' + setIdx);
  const repsEl = document.getElementById('reps-' + exId + '-' + setIdx);
  const rpeEl = document.getElementById('rpe-' + exId + '-' + setIdx);
  const kg = kgEl.value, reps = repsEl.value, rpe = rpeEl.value;
  if (!kg || !reps || !rpe) { alert('Preencha kg, reps e RPE'); return; }
  if (parseInt(rpe) < 1 || parseInt(rpe) > 10) { alert('RPE entre 1 e 10'); return; }

  const kgNum = parseFloat(kg);
  const repsNum = parseInt(reps);
  const rpeNum = parseInt(rpe);

  // VALIDAÇÃO: Jump de carga >5kg vs última válida do mesmo exercício
  const current = getCurrentSession();
  const exEntry = current.exercises.find(e => e.id === exId);
  const existing = exEntry?.sets[setIdx];
  const type = existing?.type || 'valida';

  // Pega última série válida/avançada anterior a esta no mesmo exercício (sessão atual + última sessão histórica)
  let prevWeight = null;
  if (exEntry && exEntry.sets) {
    for (let i = setIdx - 1; i >= 0; i--) {
      const s = exEntry.sets[i];
      if (s && !s.pending && s.kg !== undefined && (s.type === 'valida' || s.type === 'avancada')) {
        prevWeight = s.kg; break;
      }
    }
  }
  if (prevWeight === null) {
    const lastHist = getLastSetForExercise(state.selectedDay, exId);
    if (lastHist) prevWeight = lastHist.kg;
  }

  if (prevWeight !== null && (type === 'valida' || type === 'avancada')) {
    const jump = kgNum - prevWeight;
    if (jump > 5) {
      const ok = confirm(`⚠ Salto de carga: ${prevWeight}kg → ${kgNum}kg (+${jump.toFixed(1)}kg).\n\nSua regra é progressão máx de 5kg sem confirmação. Continuar?`);
      if (!ok) return;
    }
  }

  // VALIDAÇÃO: RPE 9+ excessivo
  const currentRPE9 = countRPE9InCurrentSession();
  // se for editar, descontar o RPE antigo dessa mesma série
  let adjustedRPE9 = currentRPE9;
  if (existing && existing.rpe >= 9 && !existing.pending) adjustedRPE9 = Math.max(0, currentRPE9 - 1);

  if (rpeNum >= 9 && adjustedRPE9 >= 2) {
    const ok = confirm(`⚠ Você já tem ${adjustedRPE9} séries RPE 9+ nesta sessão. Limite recomendado: 2.\n\nRegistrar esta também?`);
    if (!ok) return;
  }

  logSet(exId, setIdx, { kg: kgNum, reps: repsNum, rpe: rpeNum, type: type, tecnica: existing?.tecnica || null });
  if (navigator.vibrate) navigator.vibrate(50);
  state.editingSet = null;
  state.openExercises[exId] = true;
  startRest(SET_TYPES[type].rest);
}

function cancelEdit() { state.editingSet = null; render(); }

function showSummaryFor(sessionIdx) {
  const sessions = [...state.data.sessions].reverse();
  const session = sessions[sessionIdx];
  if (!session) return;
  state.summaryText = generateSummary(session);
  state.showSummary = true;
  render();
}

function closeSummary() { state.showSummary = false; state.calDetailSessionIdx = null; render(); }

// ============ CALENDÁRIO — handlers ============
function calNav(delta) {
  const [y, m] = state.calCursor.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  state.calCursor = d.toISOString().slice(0, 7);
  render();
}

function openCalDay(iso) {
  const idx = state.data.sessions.findIndex(s => s.date === iso);
  if (idx >= 0) {
    const reverseIdx = state.data.sessions.length - 1 - idx;
    showSummaryFor(reverseIdx);
    return;
  }
  // Sem sessão de força — mostra só os cardios
  const dayCardios = (state.data.cardios || []).filter(c => c.date === iso);
  if (!dayCardios.length) return;
  const dateBr = iso.split('-').reverse().join('/');
  let txt = `CARDIO — ${dateBr}\n\n`;
  dayCardios.forEach((c, i) => {
    const tipoLabel = CARDIO_TYPES[c.tipo]?.label || c.tipo;
    txt += `${i + 1}. ${tipoLabel}\n`;
    txt += `   Duração: ${c.duracao}min\n`;
    txt += `   Intensidade: ${c.intensidade}/10\n`;
    if (c.incline) txt += `   Inclinação/Nível: ${c.incline}\n`;
    if (c.obs) txt += `   Obs: ${c.obs}\n`;
    txt += '\n';
  });
  state.summaryText = txt;
  state.showSummary = true;
  render();
}

render();
</script>

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registrado:', reg.scope))
      .catch(err => console.warn('SW falhou:', err));
  });
}
</script>
